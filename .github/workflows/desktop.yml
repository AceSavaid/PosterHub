name: Desktop apps

# Pull requests that touch the desktop app: build it on Linux and run the
# desktop smoke test. Pushing a tag like v0.2.0 (or running this workflow by
# hand) builds Windows, macOS and Linux installers and attaches them to a
# draft GitHub Release for you to check and publish.
on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'src/lib/store/**'
      - 'src/lib/storage.ts'
      - 'tests/desktop/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npx tauri build --no-bundle
      - name: Desktop smoke test
        run: |
          export HOME="$RUNNER_TEMP/home" && mkdir -p "$HOME"
          TAURI_WEBVIEW_AUTOMATION=true xvfb-run -a WebKitWebDriver --port=4445 &
          # Wait for the WebDriver server to accept connections (up to 60 s).
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4445/status >/dev/null && break; sleep 1; done
          node tests/desktop/smoke.mjs src-tauri/target/release/posterhub

  release:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            name: macOS (Apple silicon)
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            name: macOS (Intel)
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            name: Windows
            args: ''
          - platform: ubuntu-22.04
            name: Linux
            args: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: PosterHub v__VERSION__
          releaseBody: |
            Download the installer for your computer below:
            - **Windows**: `PosterHub_…_x64-setup.exe` (or the `.msi`)
            - **Mac with Apple silicon (M1 and newer)**: `PosterHub_…_aarch64.dmg`
            - **Mac with Intel**: `PosterHub_…_x64.dmg`
            - **Linux**: `.AppImage`, `.deb` or `.rpm`

            The app is not signed yet, so the first time you open it: on Windows click **More info → Run anyway**; on a Mac, if it says the app can't be opened, go to **System Settings → Privacy & Security** and click **Open Anyway**.
            Your posters are saved in **Documents/PosterHub**.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
